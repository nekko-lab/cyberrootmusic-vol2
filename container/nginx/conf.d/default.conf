server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;

  location /dj-live/ {
    try_files $uri $uri/ /dj-live/index.html =404;
  }
  
  location = /dj-live {
    return 301 /dj-live/;
  }
  
  # 静的アセットのキャッシュ設定
  location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  
  # サービスワーカーはキャッシュしない
  location ~ (service-worker\.js|qwik-prefetch-service-worker\.js)$ {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # ルートパスへのアクセスは /dj-live/ にリダイレクト
  location = / {
    return 301 /dj-live/;
  }
}
