server {
    listen 80;
    server_name localhost;

    # /dj-live パスの処理
    location /dj-live {
        alias /usr/share/nginx/html/dj-live;
        index index.html;
        try_files $uri $uri/ /dj-live/index.html;
    }
    
    # 静的アセットのキャッシュ設定
    location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # サービスワーカーはキャッシュしない
    location ~ (service-worker\.js|qwik-prefetch-service-worker\.js)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ルートパスへのアクセスは /dj-live/ にリダイレクト
    location = / {
        return 301 /dj-live/;
    }
}
