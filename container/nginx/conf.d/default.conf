server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;

  location /dj-live/ {
    try_files $uri $uri/ /dj-live/index.html =404;
  }
  
  location = /dj-live {
    return 301 /dj-live/;
  }
  
  location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  
  location ~ (service-worker\.js|qwik-prefetch-service-worker\.js)$ {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = / {
    return 301 /dj-live/;
  }

  # Metrics endpoint for nginx-exporter (only accessible from localhost)
  location /metrics {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    deny all;
  }

  access_log /var/log/nginx/access.log combined_realip;
  error_log /var/log/nginx/error.log;
}
